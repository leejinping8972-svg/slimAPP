<!DOCTYPE html>
<html lang="es-MX">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="luckdate — Feel Alive. Meet luckdate.">
  <meta name="theme-color" content="#EDE4D8">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="luckdate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>luckdate</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #EDE4D8;
      overscroll-behavior: none;
    }
    /*
      CRITICAL: never style flt-glass-pane / Flutter internal nodes.
      max-width + overflow on flt-glass-pane collapses the Skia surface to 0×0
      in desktop / IDE previews (viewport ≥ 500px) → blank cream page.
    */
    #app-shell {
      position: relative;
      width: 100%;
      height: 100%;
      margin: 0 auto;
      background: #EDE4D8;
      overflow: hidden;
    }
    #flutter_target {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    @media (min-width: 500px) {
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background: #E7DED2;
      }
      #app-shell {
        width: 100%;
        max-width: 430px;
        height: 100vh;
        max-height: 932px;
        border-radius: 24px;
        box-shadow: 0 12px 48px rgba(92, 70, 53, 0.12);
      }
    }
    /* Native HTML splash — non-interactive while Flutter boots */
    #loading {
      position: absolute;
      inset: 0;
      z-index: 9999;
      overflow: hidden;
      pointer-events: none;
      background: #EDE4D8;
    }
    #loading img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    #loading .fallback {
      display: none;
      position: absolute;
      inset: 0;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #5E6B45;
      font-family: Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
      background: linear-gradient(160deg, #FFFBF7 0%, #F5EBE0 55%, #EDE4D8 100%);
    }
    #loading.fallback-active img { display: none; }
    #loading.fallback-active .fallback { display: flex; }
    #loading .fallback h1 {
      margin: 0 0 8px;
      font-size: 32px;
      font-weight: 600;
    }
    #loading .fallback p {
      margin: 0;
      font-size: 20px;
      font-weight: 400;
      opacity: 0.9;
    }
    #loading .fallback .brand {
      position: absolute;
      bottom: 48px;
      font-size: 16px;
      letter-spacing: 4px;
      color: #D4A853;
      font-weight: 400;
    }
    #loading .spinner {
      position: absolute;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      border: 2.5px solid rgba(94, 107, 69, 0.25);
      border-top-color: #5E6B45;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    #loading .boot-error {
      display: none;
      position: absolute;
      inset: 0;
      z-index: 2;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      pointer-events: auto;
      background: linear-gradient(160deg, #FFFBF7 0%, #F5EBE0 55%, #EDE4D8 100%);
      color: #5E6B45;
      font-family: Montserrat, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    #loading.boot-error-active .spinner { display: none; }
    #loading.boot-error-active .boot-error { display: flex; }
    #loading .boot-error button {
      margin-top: 8px;
      border: 0;
      border-radius: 999px;
      padding: 12px 20px;
      background: #5E6B45;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }
    @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
  </style>
</head>
<body>
  <div id="app-shell">
    <div id="flutter_target"></div>
    <div id="loading">
      <img id="splash-img" alt="Feel Alive. Meet luckdate.">
      <div class="fallback">
        <h1>Feel Alive.</h1>
        <p>Meet luckdate.</p>
        <div class="brand">luckdate</div>
      </div>
      <div class="spinner" aria-hidden="true"></div>
      <div class="boot-error" role="alert">
        <strong>No se pudo mostrar la app</strong>
        <span>Prueba recargar, o ábrela en Chrome / Safari.</span>
        <button type="button" id="reload-btn">Recargar</button>
      </div>
    </div>
  </div>
  <script>
    (function () {
      // Drop stale PWA workers from older deploys (can serve blank canvases).
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) { r.unregister(); });
        }).catch(function () {});
      }

      var base = document.querySelector('base');
      var href = base ? base.getAttribute('href') : '/';
      if (!href.endsWith('/')) href += '/';
      var img = document.getElementById('splash-img');
      var loading = document.getElementById('loading');
      img.src = href + 'welcome_bg.png';
      img.onerror = function () {
        if (img.dataset.triedAlt) {
          loading.classList.add('fallback-active');
          return;
        }
        img.dataset.triedAlt = '1';
        img.src = href + 'splash_screen.png';
      };

      var ready = false;
      function hideLoading() {
        if (ready) return;
        ready = true;
        if (loading) loading.remove();
      }
      window.addEventListener('flutter-first-frame', hideLoading);
      document.getElementById('reload-btn').addEventListener('click', function () {
        location.reload();
      });
      // If first frame never arrives, keep a visible recovery UI (not a blank cream pane).
      setTimeout(function () {
        if (ready) return;
        loading.classList.add('boot-error-active');
      }, 15000);

      // Expose host for bootstrap below.
      window.__luckdateFlutterHost = document.getElementById('flutter_target');
    })();
  </script>
  <script>
    {{flutter_js}}
    {{flutter_build_config}}
    _flutter.loader.load({
      config: {
        hostElement: window.__luckdateFlutterHost,
      },
      onEntrypointLoaded: async function (engineInitializer) {
        var appRunner = await engineInitializer.initializeEngine({
          hostElement: window.__luckdateFlutterHost,
        });
        await appRunner.runApp();
      },
    });
  </script>
</body>
</html>
